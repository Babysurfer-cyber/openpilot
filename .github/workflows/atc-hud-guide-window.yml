name: ATC HUD guide-window tests

on:
  pull_request:
    branches: [ms-xy-radar3]
    paths:
      - '.github/workflows/atc-hud-guide-window.yml'
      - 'cereal/custom.capnp'
      - 'selfdrive/carrot/carrot_serv.py'
      - 'selfdrive/carrot/tests/test_carrot_navi_atc.py'
      - 'selfdrive/ui/carrot.cc'
      - 'selfdrive/ui/atc_icon_visibility.h'
      - 'selfdrive/ui/atc_mode_background.h'
      - 'selfdrive/ui/tests/test_atc_icon_visibility.cc'
      - 'selfdrive/ui/tests/test_atc_mode_background.cc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visibility-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test pure C++ visibility predicate
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I . \
            selfdrive/ui/tests/test_atc_icon_visibility.cc \
            -o /tmp/test_atc_icon_visibility
          /tmp/test_atc_icon_visibility
      - name: Compile and test 700ms AUTO/NORM ATC mode-background logic
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I . \
            selfdrive/ui/tests/test_atc_mode_background.cc \
            -o /tmp/test_atc_mode_background
          /tmp/test_atc_mode_background
      - name: Check Python syntax
        run: |
          python3 -m py_compile \
            selfdrive/carrot/carrot_serv.py \
            selfdrive/carrot/tests/test_carrot_navi_atc.py
