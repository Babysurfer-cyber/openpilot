name: Main audit UI Fleet regression

on:
  push:
    branches: [fix/audit-ui-fleet-navi-20261126]
  pull_request:
    branches: [ms-xy-radar3]
    paths:
      - selfdrive/ui/qt/home.cc
      - selfdrive/ui/carrot.cc
      - selfdrive/frogpilot/fleetmanager/fleet_manager.py
      - selfdrive/frogpilot/fleetmanager/templates/route.html
      - selfdrive/frogpilot/fleetmanager/templates/layout.html
      - selfdrive/carrot/carrot_navi_cereal.py
      - selfdrive/carrot/tests/test_carrot_navi_atc.py
      - selfdrive/carrot/tests/test_main_audit_ui_standalone.py
      - .github/workflows/main-audit-ui-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-fleet-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax check
        run: |
          python -m py_compile selfdrive/frogpilot/fleetmanager/fleet_manager.py selfdrive/carrot/carrot_navi_cereal.py selfdrive/carrot/tests/test_main_audit_ui_standalone.py selfdrive/carrot/tests/test_carrot_navi_atc.py
      - name: Execute standalone UI Fleet navigation regressions
        run: python selfdrive/carrot/tests/test_main_audit_ui_standalone.py -v
